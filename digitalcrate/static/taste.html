<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your taste</title><link rel="icon" href="/studio/icon.svg">
<style>
:root{--bg:#0e1013;--panel:#15181d;--line:#242932;--ink:#d9dde3;--mute:#7d8592;--acc:#e0a458;--acc2:#7fb0c9;--bad:#d96c6c;--ok:#8fc98f}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,system-ui,sans-serif;margin:0;padding:20px 16px 80px}
main{max-width:1100px;margin:auto}a{color:var(--acc2)}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}h1{font-size:20px;margin:0}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0 0 10px;font-weight:600}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.sub{color:var(--mute);font-size:12px}
.big{font-size:40px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}.big small{font-size:14px;color:var(--mute);font-weight:400;margin-left:6px}
.cmp{display:grid;grid-template-columns:150px 1fr 48px;gap:6px 10px;align-items:center;margin:12px 0 4px;font-size:13px}
.hb{height:10px;background:var(--line);border-radius:3px;position:relative;overflow:hidden}.hb i{position:absolute;inset:0 auto 0 0;background:var(--acc)}
.hb .mid{position:absolute;left:0;top:-2px;bottom:-2px;width:1px;background:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}.stat span{font-size:12px;color:var(--mute)}
.words{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.w{display:grid;grid-template-columns:1fr 70px;gap:4px 8px;align-items:center;font-size:13px}
.wb{height:8px;border-radius:2px;background:var(--line);position:relative}.wb i{position:absolute;top:0;bottom:0;border-radius:2px}
.ex{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #1d2128;font-size:13px}
.ex .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{font:inherit;color:var(--ink);background:#1b1f25;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer}
button:hover{border-color:var(--mute)}button.on{background:var(--acc);color:#000;border-color:var(--acc)}button.no.on{background:var(--bad);border-color:var(--bad)}
.play{width:28px;height:28px;border-radius:50%;padding:0}.pct{font-variant-numeric:tabular-nums;color:var(--mute);font-size:12px;margin-right:6px}
svg text{fill:var(--mute);font-size:10px}
details summary{cursor:pointer;color:var(--acc2)}
</style></head><body><main>
<header><h1>🧠 Your taste model</h1><span class="sub" id="upd"></span><a href="/" style="margin-left:auto">← back to the library</a></header>
<div id="app"><div class="card sub">Loading…</div></div>
</main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,timer=null,audio=null,playing=null;const rated={};
async function load(){try{D=await (await fetch('api/taste/explain')).json()}catch(e){$('app').innerHTML='<div class="card">The server isn\'t reachable.</div>';return}
 render();clearTimeout(timer);if(D.accuracy&&D.accuracy.measuring||D.recommenders&&D.recommenders.running)timer=setTimeout(load,D.recommenders&&D.recommenders.running?15000:4000)}
const pct=x=>Math.round(x*100)+'%';
function render(){if(!D.ready){$('app').innerHTML='<div class="card">No samples yet.</div>';return}
 const A=D.accuracy||{},S=D.signals,L=D.learned||{},E=D.examples;
 $('upd').textContent=A.measuring?'measuring accuracy…':(A.when?'accuracy measured '+new Date(A.when*1000).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'');
 $('app').innerHTML=`
 <div class="grid"><div>
 <section class="card"><h2>How well it knows you</h2>
  ${A.auc==null?`<div class="sub">${A.measuring?(A.model==='reco.taste'?'Measuring… (a few minutes, in the background)':'Measuring… (about 15 seconds)'):'Star about 10 samples and it can be measured.'}</div>`:`
  <div class="big">${pct(A.auc)}<small>of the time it picks your favourite</small></div>
  <div class="sub" style="margin-top:8px">The honest test: the samples you've heard are split into five groups. For each group, everything you told it about those samples (★, ✕, listening) is hidden, the model learns from the rest, then it's shown pairs of one of the group's favourites and one it heard but you didn't star. This is how often it ranks the favourite higher. A coin flip gets 50%.</div>
  <div class="cmp"><span>your taste model</span><div class="hb"><i style="width:${A.auc*100}%"></i></div><b>${pct(A.auc)}</b>
   ${A.auc_regression!=null?`<span class="sub">· regression alone</span><div class="hb"><i style="width:${A.auc_regression*100}%;background:#c9a36b"></i></div><span>${pct(A.auc_regression)}</span>`:''}
   ${A.auc_trees!=null?`<span class="sub">· trees alone</span><div class="hb"><i style="width:${A.auc_trees*100}%;background:#8fc98f"></i></div><span>${pct(A.auc_trees)}</span>`:''}
   <span>sample quality alone</span><div class="hb"><i style="width:${(A.quality_auc||0)*100}%;background:var(--acc2)"></i></div><span>${pct(A.quality_auc||0)}</span>
   <span>coin flip</span><div class="hb"><i style="width:50%;background:var(--mute)"></i></div><span>50%</span></div>
  ${A.auc_trees!=null?`<div class="sub" style="margin-bottom:6px">Your model averages two learners: a <b>regression</b> (steady, and it knows how unsure it is, which picks "teach it the most") and <b>gradient-boosted trees</b> (more flexible; they may pull ahead as you rate more). Both are measured each time, so the chart shows which is doing better.</div>`:''}
  <div class="sub">"Quality" is how clean and isolated a sample is. Near 50% means what you star isn't about cleanliness: it's about sound and mood, which is what the model learns.</div>`}
  ${chart()}
  ${forwardHTML()}
 </section>
 ${sourcesHTML()}
 <section class="card"><h2>What it learns from</h2>
  <div class="stats"><div class="stat"><b>${S.favourites}</b><span>★ favourites (strongest signal)</span></div><div class="stat"><b>${S.dislikes}</b><span>✕ not for me (strong)</span></div>
  <div class="stat"><b>${S.liked_by_listening}</b><span>liked by listening</span></div><div class="stat"><b>${S.skipped}</b><span>skipped</span></div><div class="stat"><b>${S.listens.toLocaleString()}</b><span>plays in total</span></div></div>
  <details style="margin-top:10px"><summary>How plays count</summary><div class="sub" style="margin-top:6px">
  A sample counts as <b>liked by listening</b> after 3 plays or 12 seconds of listening in total; as <b>skipped</b> when every play of a longer sample stopped in the first 15%. Plays fade over about two months, so recent listening counts most. Stars and ✕ always win over plays. "Played to the end" doesn't count by itself: a half-second chop always plays to the end.<br><br>
  A short sample (3 s or less) you played once and passed over, while starring others in the same session, counts as a weak "not this one": a 1-second clip can't be skipped.<br><br>
  To fill in the gaps, the model also treats random samples you've never heard as weak "probably not" examples (60 per favourite, each worth a tenth of a skip). Most of the library is like that, so the model learns what sets your picks apart.</div></details>
 </section>
 ${editsHTML(D.edits)}
 <section class="card"><h2>Where it's going wrong</h2>
  ${wrongHTML(E)}
 </section>
 </div><div>
 ${recosHTML()}
 <section class="card"><h2>What it has learned, in words</h2>
  <div class="sub" style="margin-bottom:10px">Descriptions scored by the model, through CLAP, which places words and sounds in the same space. Read it as a hint, not a measurement.${L.from?` These come from ${esc(L.from)}; the rankings on this page are the model in use.`:''}</div>
  <div class="words"><div><div class="sub" style="margin-bottom:4px">leans toward</div>${words(L.words_up||[],'var(--ok)')}</div><div><div class="sub" style="margin-bottom:4px">leans away from</div>${words(L.words_down||[],'var(--bad)')}</div></div>
 </section>
 <section class="card"><h2>By category and kind</h2>
  <div class="sub" style="margin-bottom:8px">Where an average sample of each ranks (50 = the middle of your library).</div>
  ${bars(D.by_category)}<div style="height:10px"></div>${bars(D.by_kind)}
  ${(L.features||[]).length?`<details style="margin-top:10px"><summary>Between two samples that sound alike…</summary><div class="sub" style="margin:6px 0">…it prefers the one that's: ${L.features.filter(f=>f[1]>0.1).map(f=>`<b>${esc(f[0])}</b>`).join(', ')||'—'}; and not the one that's ${L.features.filter(f=>f[1]<-0.1).map(f=>`<b>${esc(f[0])}</b>`).join(', ')||'—'}.</div></details>`:''}
 </section>
 <section class="card"><h2>Teach it the most</h2>
  <div class="sub" style="margin-bottom:6px">Samples it's least sure about. A ★ or ✕ on these changes its mind the most.</div>
  ${E.unsure.map(r=>exRow(r,true)).join('')}
 </section>
 <section class="card"><h2>Its top picks you haven't heard</h2>${E.top.map(r=>exRow(r,true)).join('')}</section>
 </div></div>
 <div class="sub">Model: ${esc(D.model)}. It refits whenever you star, ✕ or play something.</div>`}
const TASKN={sample_taste:'Samples: for you, discover, sets, kits',new_songs:'Samples from songs you never rated',mashup_part:'Mashup dice',edit_move:'Edit suggestions',pair:'Goes well with',scout:'Scout'};
const SPLITN={sample:'by sample',song:'by song (songs it never saw)',forward:'forward in time (what came next)',source:'by source sample',video:'by video'};
function recosHTML(){const R=D.recommenders||{},T=R.tasks||[],St=D.settings||{},cur=St.current||{},ch=St.choices||{},ab=St.about||{};
 const f3=v=>v==null?'—':v.toFixed(3),ci=c=>c?` <span class="sub">[${c[0].toFixed(2)}, ${c[1].toFixed(2)}]</span>`:'';
 const sw=Object.keys(ch).map(k=>`<div style="margin:4px 0"><span style="display:inline-block;width:70px">${esc(k)}</span>${ch[k].map(v=>`<button data-reco="${esc(k)}" data-val="${esc(v)}" class="${cur[k]===v?'on':''}" title="${esc((ab[k]||{})[v]||'')}">${esc(v)}</button>`).join(' ')} <span class="sub">${esc((ab[k]||{})[cur[k]]||'')}</span></div>`).join('');
 const body=T.length?T.map(t=>`<div style="margin:12px 0 4px"><b>${esc(TASKN[t.task]||t.task)}</b> <span class="sub">· ${esc(t.about||'')} · ${esc(t.metric)}${t.when?' · measured '+new Date(t.when*1000).toLocaleDateString():''}${t.quick?' (quick)':''}</span></div>
  ${t.splits.map(sp=>`<div class="sub" style="margin:4px 0 2px">${esc(SPLITN[sp.split]||sp.split)}${sp.n!=null?` · ${sp.n} examples (${sp.pos} yes, ${sp.neg} no)`:''}</div>
   ${sp.insufficient?`<div class="sub">too little data: ${esc(sp.insufficient.replace(/^too little data to say anything: /,''))}</div>`:
   `<div style="display:grid;grid-template-columns:minmax(0,1.4fr) 80px minmax(0,1.6fr) minmax(0,1.6fr);gap:2px 10px;font-size:13px">${(sp.rows||[]).map(r=>`<span>${esc(r.model)} <span class="sub">${esc(r.role)}</span></span><span class="sub">${esc(r.role)==='in use'?'●':''}</span><span>${f3(r.mean)}${ci(r.ci)}</span><span>${r.vs?`${r.vs.diff>=0?'+':''}${r.vs.diff.toFixed(3)}${ci(r.vs.ci)} <span class="sub">vs ${esc(t.reference)} · won ${r.vs.won}/${r.vs.of} folds</span>`:''}</span>`).join('')}</div>`}`).join('')}`).join('')
  :'<div class="sub">Not measured yet.</div>';
 return `<section class="card"><h2>How well each recommender predicts you</h2>
  <div class="sub">Each recommender against held-out data (the harness: <code>digitalcrate reco eval</code>): a number is how often it ranks what you kept above what you passed over (0.5 is a coin flip), with its 95% interval, and how far ahead it is of the task's reference (the model that was in use before the switch-over). An interval that includes zero means the data can't tell them apart yet.</div>
  ${body}
  <div style="margin-top:10px"><button id="recoeval" ${R.running?'disabled':''}>${R.running?'measuring… (several minutes)':'measure again'}</button></div>
  <h3 style="margin:16px 0 4px;font-size:14px">Which model deals</h3>${sw}
  <div class="sub" style="margin-top:4px">Everything dealt or listed is logged with the model that dealt it, so the two can be compared later.</div>
 </section>`}
function wrongHTML(E){const miss=E.missed.filter(r=>r.pct<70),bad=E.wrong.filter(r=>r.pct>50);
 const lowest=E.missed.length?Math.min(...E.missed.map(r=>r.pct)):null;
 let h='<div class="sub" style="margin-bottom:6px">The number on the right is where it ranks a sample in your library (100 = its top pick). If the samples below have something in common, that\'s what it hasn\'t understood yet.</div>';
 h+=miss.length?`<div class="sub" style="margin:6px 0 2px">★ favourites it ranks low</div>${miss.map(r=>exRow(r)).join('')}`
  :lowest!=null?`<div class="sub" style="margin:6px 0">Every ★ favourite ranks in its top ${100-lowest}% (the lowest is at ${lowest}): it isn't badly wrong about any of them.</div>`:'';
 h+=bad.length?`<div class="sub" style="margin:10px 0 2px">✕ samples it still ranks above the middle</div>${bad.map(r=>exRow(r)).join('')}`
  :'<div class="sub" style="margin:6px 0">Everything you marked ✕ ranks below the middle.</div>';
 return h}
function editsHTML(E){if(!E)return'';const sl=E.slots||{},r=E.ratings||{},m=E.model||{};
 const shown=Object.values(sl).reduce((a,x)=>a+x.shown,0),nr=Object.values(r).reduce((a,x)=>a+x.up+x.down,0);
 if(!shown&&!nr)return '';
 const pc=(a,b)=>b?Math.round(a/b*100)+'%':'—',row=(k,lab)=>{const s=sl[k]||{shown:0,kept:0},q=r[k]||{up:0,down:0};
  return `<span>${lab}</span><span>${s.shown}</span><span>${pc(s.kept,s.shown)}</span><span>${q.up} 👍 · ${q.down} 👎</span><span>${pc(q.up,q.up+q.down)}</span>`};
 return `<section class="card"><h2>Edit suggestions (✨ in the editor)</h2>
 <div style="display:grid;grid-template-columns:auto repeat(4,auto);gap:4px 16px;font-size:13px;align-items:center">
 <span class="sub"></span><span class="sub">shown</span><span class="sub">used or saved</span><span class="sub">your ratings</span><span class="sub">liked</span>
 ${row('critic','the model\'s picks')}${row('wildcard','the random wildcard')}${r['your edits']?`<span>your own edits</span><span>—</span><span>—</span><span>${r['your edits'].up} 👍 · ${r['your edits'].down} 👎</span><span>${pc(r['your edits'].up,r['your edits'].up+r['your edits'].down)}</span>`:''}</div>
 <div class="sub" style="margin-top:8px">If the model's picks are used and liked more often than the wildcard, it's helping. Every 👍/👎 (and why) teaches it which edits you like and how strong.
 ${m.on?`Its edit model, learned from your ${m.n} ratings, ${m.auc!=null?`predicts a rating it hasn't seen ${Math.round(m.auc*100)}% of the time.`:'is on (its accuracy shows after about 12 ratings).'}`:`Its edit model starts after about 8 ratings with a few of each (${m.n||0} so far).`}</div></section>`}
function forwardHTML(){const F=D.forward,R=F&&F.results||[];
 if(!F)return '<div class="sub" style="margin-top:14px">Measuring how well it predicts what you hear next…</div>';if(R.length<2)return '';
 const last=R.slice(-3),w=last.map(r=>1/Math.max(1e-4,r.se*r.se)),sw=w.reduce((a,b)=>a+b,0),m=last.reduce((a,r,k)=>a+r.auc*w[k],0)/sw,se=Math.sqrt(1/sw);
 const qb=last.reduce((a,r)=>a+r.quality_auc,0)/last.length;
 const W=520,Ht=170,L=44,Rr=14,T=12,B=26,xs=R.map((r,i)=>L+i*(W-L-Rr)/(R.length-1)),y=v=>T+(1-v)/0.7*(Ht-T-B);  // 30%..100%
 const grid=[0.3,0.5,0.7,0.9,1];
 return `<h3 style="margin:18px 0 4px;font-size:14px">Predicting what you'll like next</h3>
 <div class="big" style="font-size:26px">${pct(m)}<small> ± ${Math.round(se*100)} · the last ${last.length} stretches</small></div>
 <div class="sub" style="margin-top:6px">A stricter test that replays your history: the model learns only what you'd told it up to a moment, then ranks the samples you heard for the first time after it (each stretch holds about 18 new favourites). This is the real job, guessing what you'll like next, so it reads lower than the score above, and older ratings can't flatter it. Both scores are shaped by what you choose to listen to; <b>Where your stars come from</b> (below) compares against random picks, so it isn't. Sample quality alone scores ${pct(qb)} on the same stretches.</div>
 <div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${Ht}" width="100%" style="max-width:${W}px">
 ${grid.map(g=>`<line x1="${L}" x2="${W-Rr}" y1="${y(g)}" y2="${y(g)}" stroke="${g===0.5?'#3a414c':'#242932'}"/><text x="${L-6}" y="${y(g)+3}" text-anchor="end">${Math.round(g*100)}%</text>`).join('')}
 ${R.map((r,i)=>`<line x1="${xs[i]}" x2="${xs[i]}" y1="${y(Math.min(1,r.auc+r.se))}" y2="${y(Math.max(0.3,r.auc-r.se))}" stroke="var(--acc)" stroke-opacity=".45" stroke-width="2"/>`).join('')}
 <path d="${R.map((r,i)=>`${i?'L':'M'}${xs[i].toFixed(1)},${y(r.quality_auc).toFixed(1)}`).join('')}" fill="none" stroke="var(--acc2)" stroke-width="1.5" stroke-dasharray="4 3"/>
 <path d="${R.map((r,i)=>`${i?'L':'M'}${xs[i].toFixed(1)},${y(r.auc).toFixed(1)}`).join('')}" fill="none" stroke="var(--acc)" stroke-width="2"/>
 ${R.map((r,i)=>`<circle cx="${xs[i]}" cy="${y(r.auc)}" r="3.5" fill="var(--acc)"><title>${new Date(r.t*1000).toLocaleString()} · learned from ${r.n_train} ratings · ranked the next ${r.n_test} samples you heard: ${pct(r.auc)} ± ${Math.round(r.se*100)} (quality alone ${pct(r.quality_auc)})</title></circle>`).join('')}
 <text x="${L}" y="${Ht-6}">${new Date(R[0].t*1000).toLocaleDateString()}</text><text x="${W-Rr}" y="${Ht-6}" text-anchor="end">${new Date(R[R.length-1].t*1000).toLocaleDateString()}</text></svg></div>
 <div class="sub">— your model, with how much each stretch could wobble by chance &nbsp; <span style="color:var(--acc2)">- - quality alone</span> &nbsp; · 50% is a coin flip</div>`}
function sourcesHTML(){const R=D.sources||[];
 const head=`<section class="card"><h2>Where your stars come from</h2><div class="sub">Every play is now logged with where you played it from. This is the plainest test of the recommendations: of the samples you first heard from each place, how many you starred. <b>For you</b> and the crate's picks should beat <b>best quality</b>, <b>random</b> and the wildcards (which are there to teach the model, not to please you).</div>`;
 if(!R.length)return head+'<div class="sub" style="margin-top:10px">Collecting: this fills in as you listen. Give it a few sessions.</div></section>';
 const mx=Math.max(...R.map(r=>r[2]),0.01);
 return head+`<div class="w" style="grid-template-columns:200px 1fr 120px;margin-top:10px">${R.map(r=>`<span>${esc(r[0])} <span class="sub">${r[1]} heard</span></span><div class="hb"><i style="width:${r[2]/mx*100}%;background:var(--ok)"></i></div><span>${Math.round(r[2]*100)}% ★ <span class="sub">${Math.round(r[3]*100)}% ✕</span></span>`).join('')}</div>
 <div class="sub" style="margin-top:6px">Under about 30 heard, a row is mostly chance.</div></section>`}
function chart(){const H=D.history||[];if(H.length<2)return H.length?'<div class="sub" style="margin-top:10px">The trend appears here after the next change to your ratings.</div>':'';
 // the vertical scale fits the data (not 0-100%), so a change of a point or two is visible; gridlines say where it is
 const keys=['auc','auc_regression','auc_trees'],vals=H.flatMap(h=>keys.map(k=>h[k]).filter(v=>v!=null));
 let lo=Math.min(...vals),hi=Math.max(...vals);const pad=Math.max(0.01,(hi-lo)*0.15);lo-=pad;hi+=pad;if(hi-lo<0.06){const m=(hi+lo)/2;lo=m-0.03;hi=m+0.03}
 const W=520,Ht=200,L=44,R=14,T=12,B=28,xs=H.map((h,i)=>L+i*(W-L-R)/(H.length-1)),y=v=>T+(hi-v)/(hi-lo)*(Ht-T-B);
 const step=(hi-lo)>0.2?0.05:(hi-lo)>0.08?0.02:0.01,grid=[];for(let g=Math.ceil(lo/step)*step;g<=hi+1e-9;g+=step)grid.push(+g.toFixed(3));
 const line=k=>{const pts=H.map((h,i)=>h[k]!=null?[xs[i],y(h[k])]:null).filter(Boolean);return pts.length>1?pts.map((q,i)=>`${i?'L':'M'}${q[0].toFixed(1)},${q[1].toFixed(1)}`).join(''):''};
 const path=line('auc'),pr=line('auc_regression'),pt=line('auc_trees'),last=H[H.length-1];
 const band=()=>{const P=H.map((h,i)=>h.se!=null?i:-1).filter(i=>i>=0);if(P.length<2)return '';  // ± the measurement's own wobble
  return `<path d="${P.map((i,k)=>`${k?'L':'M'}${xs[i].toFixed(1)},${y(H[i].auc+H[i].se).toFixed(1)}`).join('')}${P.slice().reverse().map(i=>`L${xs[i].toFixed(1)},${y(H[i].auc-H[i].se).toFixed(1)}`).join('')}Z" fill="var(--acc)" fill-opacity=".12"/>`};
 return `<div class="sub" style="margin:12px 0 2px">Over time (each point is a measurement after your ratings changed)</div><div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${Ht}" width="100%" style="max-width:${W}px">
 ${grid.map(g=>`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="#242932"/><text x="${L-6}" y="${y(g)+3}" text-anchor="end">${Math.round(g*100)}%</text>`).join('')}
 ${pr?`<path d="${pr}" fill="none" stroke="#c9a36b" stroke-width="1.5" stroke-dasharray="4 3"/>`:''}${pt?`<path d="${pt}" fill="none" stroke="#8fc98f" stroke-width="1.5" stroke-dasharray="4 3"/>`:''}
 ${band()}<path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2.5"/>${H.map((h,i)=>`<circle cx="${xs[i]}" cy="${y(h.auc)}" r="3.5" fill="var(--acc)"><title>${new Date(h.ts*1000).toLocaleString()} · ${pct(h.auc)}${h.auc_regression!=null?` (regression ${pct(h.auc_regression)}, trees ${pct(h.auc_trees)})`:''} · ${h.n_fav} favourites</title></circle>`).join('')}
 <text x="${xs[xs.length-1]}" y="${y(last.auc)-8}" text-anchor="end" style="fill:var(--ink);font-size:11px">${pct(last.auc)}</text>
 <text x="${L}" y="${Ht-8}">${H[0].n_fav} ★</text><text x="${W-R}" y="${Ht-8}" text-anchor="end">${last.n_fav} ★</text></svg></div>
 <div class="sub">${pr||pt?'— your model &nbsp; <span style="color:#c9a36b">- - regression alone</span> &nbsp; <span style="color:#8fc98f">- - trees alone</span> &nbsp; · ':''}the scale is zoomed in to the range measured (a coin flip would be 50%)</div>`}
function words(ws,c){const m=Math.max(...ws.map(w=>Math.abs(w[1])),1);return `<div class="w">${ws.map(w=>`<span>${esc(w[0])}</span><div class="wb"><i style="left:0;width:${Math.abs(w[1])/m*100}%;background:${c}"></i></div>`).join('')}</div>`}
function bars(rows){return `<div class="w" style="grid-template-columns:150px 1fr 40px">${(rows||[]).map(r=>`<span>${esc(r[0])} <span class="sub">${r[2].toLocaleString()}</span></span><div class="hb"><i style="width:${r[1]}%;background:${r[1]>=50?'var(--ok)':'var(--acc2)'}"></i></div><span class="sub">${r[1]}</span>`).join('')}</div>`}
function exRow(r,rate){const st=rated[r.path];return `<div class="ex"><button class="play" data-p="${esc(r.path)}">${playing===r.path?'■':'▶'}</button>
 <div class="t"><b>${esc(r.sub||'')}</b> · ${esc(r.artist||'')} — ${esc(r.title||'')}${r.why?`<div class="sub">${esc(r.why)}</div>`:''}</div>
 <div><span class="pct" title="its score, as a percentile of your library">${r.pct}</span>${rate?`<button data-fav="${esc(r.path)}" data-id="${esc(r.id)}" class="${st==='fav'?'on':''}" title="★ favourite">★</button> <button data-no="${esc(r.path)}" data-id="${esc(r.id)}" class="no ${st==='no'?'on':''}" title="not for me">✕</button>`:''}</div></div>`}
document.addEventListener('click',async e=>{const rb=e.target.closest('[data-reco]');if(rb){await fetch('api/reco/settings',{method:'POST',body:JSON.stringify({surface:rb.dataset.reco,value:rb.dataset.val})});load();return}
 if(e.target.closest('#recoeval')){await fetch('api/reco/eval',{method:'POST',body:'{}'});load();return}
 const p=e.target.closest('[data-p]');if(p){const path=p.dataset.p;if(audio){audio.pause();audio=null}
  if(playing===path){playing=null;render();return}playing=path;audio=new Audio('/'+path.split('/').map(encodeURIComponent).join('/'));audio.play();
  const t0=Date.now();audio.onended=audio.onpause=()=>{fetch('api/event',{method:'POST',body:JSON.stringify({path,type:'listen',value:Math.min(1,(Date.now()-t0)/1000/Math.max(.3,audio?audio.duration||1:1))})}).catch(()=>{});if(playing===path){playing=null;render()}};render();return}
 const f=e.target.closest('[data-fav]');if(f){const on=rated[f.dataset.fav]!=='fav';rated[f.dataset.fav]=on?'fav':null;
  await fetch('api/fav',{method:'POST',body:JSON.stringify({path:f.dataset.fav,id:f.dataset.id,on,label:'from the Taste page'})});render();return}
 const n=e.target.closest('[data-no]');if(n){const on=rated[n.dataset.no]!=='no';rated[n.dataset.no]=on?'no':null;
  await fetch('api/event',{method:'POST',body:JSON.stringify({path:n.dataset.no,id:n.dataset.id,type:'dislike',value:on?1:0})});render()}});
load();
</script></body></html>
